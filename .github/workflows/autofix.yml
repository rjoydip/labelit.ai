name: Auto-fix

# Required GitHub Secrets (set in repository settings -> Secrets and variables -> Actions):
#   GH_USER_EMAIL - Email for git config (fallback: github-actions[bot]@users.noreply.github.com)
#   GH_USER_NAME  - Name for git config (fallback: github-actions[bot])

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - ".github/workflows/*.yml"
  workflow_dispatch:

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Auto-fix Lint Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun-install-cache
          key: ${{ runner.os }}-bun-deps-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-deps-

      - name: Install dependencies
        run: bun install ${{ github.actor == 'dependabot[bot]' && '' || '--frozen-lockfile' }}

      - name: Run auto-fix
        run: bun run lint

      - name: Create commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: apply automated lint fixes"
          file_pattern: "*.ts *.tsx *.js *.json *.css *.scss"
